name: Patch Termux Bootstrap (Fast Method)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Architecture to patch'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - arm
          - i686
          - x86_64
      bootstrap_url:
        description: 'Bootstrap URL (leave empty for latest official)'
        required: false
        default: ''

env:
  ORIGINAL_PACKAGE: com.termux
  CUSTOM_PACKAGE: com.codeeditor.android

jobs:
  patch-bootstrap:
    name: Patch Bootstrap for ${{ github.event.inputs.architecture }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Get latest bootstrap URL
      id: get_url
      run: |
        ARCH="${{ github.event.inputs.architecture }}"
        
        if [[ -n "${{ github.event.inputs.bootstrap_url }}" ]]; then
          BOOTSTRAP_URL="${{ github.event.inputs.bootstrap_url }}"
        else
          echo "Fetching latest bootstrap release info..."
          
          RELEASE_INFO=$(curl -s "https://api.github.com/repos/termux/termux-packages/releases" | \
            jq -r '[.[] | select(.tag_name | startswith("bootstrap-"))][0]')
          
          TAG_NAME=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
          echo "Latest bootstrap tag: $TAG_NAME"
          
          BOOTSTRAP_URL="https://github.com/termux/termux-packages/releases/download/${TAG_NAME}/bootstrap-${ARCH}.zip"
        fi
        
        echo "Bootstrap URL: $BOOTSTRAP_URL"
        echo "url=$BOOTSTRAP_URL" >> $GITHUB_OUTPUT
        
    - name: Download official bootstrap
      run: |
        ARCH="${{ github.event.inputs.architecture }}"
        URL="${{ steps.get_url.outputs.url }}"
        
        echo "Downloading bootstrap from: $URL"
        
        curl -L -o "bootstrap-${ARCH}-original.zip" "$URL"
        
        if [ ! -f "bootstrap-${ARCH}-original.zip" ]; then
          echo "::error::Failed to download bootstrap"
          exit 1
        fi
        
        ls -la "bootstrap-${ARCH}-original.zip"
        echo "Download size: $(du -h bootstrap-${ARCH}-original.zip | cut -f1)"
        
    - name: Extract bootstrap
      run: |
        ARCH="${{ github.event.inputs.architecture }}"
        
        mkdir -p bootstrap-extract
        cd bootstrap-extract
        
        echo "Extracting bootstrap..."
        unzip -q "../bootstrap-${ARCH}-original.zip"
        
        echo "Extracted files count: $(find . -type f | wc -l)"
        echo "Total size: $(du -sh . | cut -f1)"
        
    - name: Patch paths in all files
      run: |
        cd bootstrap-extract
        
        OLD_PATH="/data/data/${{ env.ORIGINAL_PACKAGE }}"
        NEW_PATH="/data/data/${{ env.CUSTOM_PACKAGE }}"
        
        echo "Patching paths:"
        echo "  FROM: $OLD_PATH"
        echo "  TO:   $NEW_PATH"
        
        echo ""
        echo "=== Finding files with original paths ==="
        MATCHES_BEFORE=$(grep -rl "${{ env.ORIGINAL_PACKAGE }}" . 2>/dev/null | wc -l || echo "0")
        echo "Files containing original package name: $MATCHES_BEFORE"
        
        echo ""
        echo "=== Patching text files ==="
        
        find . -type f ! -name "*.so" ! -name "*.a" ! -name "*.o" -print0 | \
          xargs -0 -r sed -i "s|$OLD_PATH|$NEW_PATH|g" 2>/dev/null || true
          
        find . -type f ! -name "*.so" ! -name "*.a" ! -name "*.o" -print0 | \
          xargs -0 -r sed -i "s|${{ env.ORIGINAL_PACKAGE }}|${{ env.CUSTOM_PACKAGE }}|g" 2>/dev/null || true
        
        echo ""
        echo "=== Patching binary files (ELF executables) ==="
        
        for binary in $(find . -type f -executable 2>/dev/null); do
          if file "$binary" | grep -q "ELF"; then
            if grep -q "${{ env.ORIGINAL_PACKAGE }}" "$binary" 2>/dev/null; then
              echo "Patching binary: $binary"
              sed -i "s|$OLD_PATH|$NEW_PATH|g" "$binary" 2>/dev/null || true
              sed -i "s|${{ env.ORIGINAL_PACKAGE }}|${{ env.CUSTOM_PACKAGE }}|g" "$binary" 2>/dev/null || true
            fi
          fi
        done
        
        echo ""
        echo "=== Patching SYMLINKS.txt ==="
        if [ -f "SYMLINKS.txt" ]; then
          sed -i "s|$OLD_PATH|$NEW_PATH|g" SYMLINKS.txt
          sed -i "s|${{ env.ORIGINAL_PACKAGE }}|${{ env.CUSTOM_PACKAGE }}|g" SYMLINKS.txt
          echo "SYMLINKS.txt patched"
          head -20 SYMLINKS.txt
        fi
        
        echo ""
        echo "=== Verification ==="
        MATCHES_AFTER=$(grep -rl "${{ env.ORIGINAL_PACKAGE }}" . 2>/dev/null | wc -l || echo "0")
        echo "Files still containing original package name: $MATCHES_AFTER"
        
        if [ "$MATCHES_AFTER" -gt 0 ]; then
          echo "::warning::Some files still contain original package name (likely binaries)"
          grep -rl "${{ env.ORIGINAL_PACKAGE }}" . 2>/dev/null | head -10 || true
        fi
        
        NEW_MATCHES=$(grep -rl "${{ env.CUSTOM_PACKAGE }}" . 2>/dev/null | wc -l || echo "0")
        echo "Files now containing new package name: $NEW_MATCHES"
        
    - name: Create patched bootstrap ZIP
      run: |
        ARCH="${{ github.event.inputs.architecture }}"
        VERSION=$(date +%Y.%m.%d)
        
        cd bootstrap-extract
        
        echo "Creating patched bootstrap ZIP..."
        zip -r9 "../bootstrap-${ARCH}.zip" ./*
        
        cd ..
        ls -la "bootstrap-${ARCH}.zip"
        echo "Patched bootstrap size: $(du -h bootstrap-${ARCH}.zip | cut -f1)"
        
    - name: Prepare artifacts
      run: |
        ARCH="${{ github.event.inputs.architecture }}"
        VERSION=$(date +%Y.%m.%d)
        
        mkdir -p artifacts
        mv "bootstrap-${ARCH}.zip" artifacts/
        
        cat > artifacts/VERSION.txt << EOF
        Patched Termux Bootstrap
        ========================
        
        Version: $VERSION
        Architecture: $ARCH
        Original Package: ${{ env.ORIGINAL_PACKAGE }}
        Patched Package: ${{ env.CUSTOM_PACKAGE }}
        Patch Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
        Source Bootstrap: ${{ steps.get_url.outputs.url }}
        
        Paths changed:
        /data/data/${{ env.ORIGINAL_PACKAGE }}/files/usr
        -> /data/data/${{ env.CUSTOM_PACKAGE }}/files/usr
        
        Usage:
        1. Create a GitHub Release with this bootstrap file
        2. Update TermuxBootstrap.java:
           
           private static final String BOOTSTRAP_URL = 
               "https://github.com/YOUR_USER/YOUR_REPO/releases/download/TAG/bootstrap-${ARCH}.zip";
           private static final String BOOTSTRAP_VERSION = "$VERSION";
        EOF
        
        cd artifacts
        sha256sum "bootstrap-${ARCH}.zip" > "bootstrap-${ARCH}.sha256"
        
        echo "=== Artifacts ==="
        ls -la
        cat VERSION.txt
        
    - name: Upload patched bootstrap
      uses: actions/upload-artifact@v4
      with:
        name: bootstrap-${{ github.event.inputs.architecture }}-patched
        path: artifacts/
        retention-days: 90
        
    - name: Build summary
      run: |
        ARCH="${{ github.event.inputs.architecture }}"
        
        echo "## Patched Bootstrap Ready!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture**: $ARCH" >> $GITHUB_STEP_SUMMARY
        echo "- **Original Package**: \`${{ env.ORIGINAL_PACKAGE }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Patched Package**: \`${{ env.CUSTOM_PACKAGE }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the artifact from below" >> $GITHUB_STEP_SUMMARY
        echo "2. Create a GitHub Release and upload \`bootstrap-${ARCH}.zip\`" >> $GITHUB_STEP_SUMMARY
        echo "3. Update \`TermuxBootstrap.java\` with the release URL" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### File Checksum" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat artifacts/bootstrap-${ARCH}.sha256 >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
