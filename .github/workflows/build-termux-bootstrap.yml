name: Build Custom Termux Bootstrap

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Architecture to build'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - arm
          - i686
          - x86_64
      force_build:
        description: 'Force rebuild all packages (-f flag)'
        required: false
        default: true
        type: boolean

env:
  CUSTOM_PACKAGE_NAME: com.codeeditor.android

jobs:
  build-bootstrap:
    name: Build Termux Bootstrap (${{ github.event.inputs.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 600
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Maximize build space
      run: |
        echo "=== Initial disk space ==="
        df -h
        
        echo "=== Removing unnecessary files to free space ==="
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /usr/share/swift || true
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
        
        sudo docker system prune -af || true
        
        echo "=== Final disk space ==="
        df -h
        
    - name: Clone termux-packages
      run: |
        echo "=== Cloning termux-packages ==="
        git clone --depth=1 https://github.com/termux/termux-packages.git
        cd termux-packages
        echo "Cloned at commit: $(git rev-parse HEAD)"
        
    - name: Patch properties.sh for custom package name
      run: |
        cd termux-packages
        
        echo "=== Original TERMUX_APP_PACKAGE value ==="
        grep "TERMUX_APP_PACKAGE" scripts/properties.sh || true
        
        # Backup original
        cp scripts/properties.sh scripts/properties.sh.original
        
        # Replace package name - handle different possible formats
        sed -i "s|TERMUX_APP_PACKAGE=\"com.termux\"|TERMUX_APP_PACKAGE=\"${{ env.CUSTOM_PACKAGE_NAME }}\"|g" scripts/properties.sh
        sed -i "s|TERMUX_APP_PACKAGE='com.termux'|TERMUX_APP_PACKAGE='${{ env.CUSTOM_PACKAGE_NAME }}'|g" scripts/properties.sh
        
        echo "=== Patched TERMUX_APP_PACKAGE value ==="
        grep "TERMUX_APP_PACKAGE" scripts/properties.sh
        
        echo "=== Full diff ==="
        diff scripts/properties.sh.original scripts/properties.sh || echo "Changes applied"
        
    - name: Verify Docker setup
      run: |
        docker --version
        docker info
        
    - name: Initialize Termux build environment
      run: |
        cd termux-packages
        chmod +x scripts/*.sh
        
        echo "=== Testing Docker container ==="
        ./scripts/run-docker.sh echo "Docker container initialized successfully"
        
    - name: Clean previous builds
      run: |
        cd termux-packages
        echo "=== Cleaning previous builds ==="
        ./scripts/run-docker.sh ./clean.sh || echo "Clean completed (or nothing to clean)"
        
    - name: Build bootstrap
      id: build
      run: |
        cd termux-packages
        
        ARCH="${{ github.event.inputs.architecture }}"
        echo "=== Building bootstrap for $ARCH ==="
        
        BUILD_FLAGS="--architectures $ARCH"
        if [[ "${{ github.event.inputs.force_build }}" == "true" ]]; then
          BUILD_FLAGS="$BUILD_FLAGS -f"
        fi
        
        echo "Build command: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh $BUILD_FLAGS"
        
        # Run the build with logging
        set +e
        ./scripts/run-docker.sh ./scripts/build-bootstraps.sh $BUILD_FLAGS 2>&1 | tee build.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        set -e
        
        echo "Build exit code: $BUILD_EXIT_CODE"
        echo "build_exit_code=$BUILD_EXIT_CODE" >> $GITHUB_OUTPUT
        
        # Check for bootstrap file
        echo "=== Searching for bootstrap files ==="
        find . -name "bootstrap-*.zip" -type f 2>/dev/null || echo "No bootstrap files found"
        
        if [ -f "bootstrap-$ARCH.zip" ]; then
          echo "bootstrap_found=true" >> $GITHUB_OUTPUT
          echo "Bootstrap file found: bootstrap-$ARCH.zip"
          ls -la "bootstrap-$ARCH.zip"
        else
          echo "bootstrap_found=false" >> $GITHUB_OUTPUT
          echo "::warning::Bootstrap file not found!"
        fi
        
    - name: Analyze build log for errors
      if: always()
      run: |
        cd termux-packages
        if [ -f build.log ]; then
          echo "=== Last 200 lines of build log ==="
          tail -200 build.log
          
          echo ""
          echo "=== Error summary ==="
          grep -i "error\|failed\|fatal" build.log | tail -50 || echo "No obvious errors found"
        fi
        
    - name: Prepare artifacts
      if: steps.build.outputs.bootstrap_found == 'true'
      run: |
        ARCH="${{ github.event.inputs.architecture }}"
        VERSION=$(date +%Y.%m.%d)
        
        mkdir -p artifacts
        
        cp "termux-packages/bootstrap-$ARCH.zip" artifacts/
        
        # Create version info
        cat > artifacts/VERSION.txt << EOF
        Bootstrap Version: $VERSION
        Target Package: ${{ env.CUSTOM_PACKAGE_NAME }}
        Architecture: $ARCH
        Build Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
        Termux-packages Commit: $(cd termux-packages && git rev-parse HEAD)
        
        This bootstrap was compiled with paths for:
        /data/data/${{ env.CUSTOM_PACKAGE_NAME }}/files/usr
        
        To use, update TermuxBootstrap.java:
        BOOTSTRAP_URL = "https://github.com/YOUR_USER/YOUR_REPO/releases/download/TAG/bootstrap-$ARCH.zip"
        BOOTSTRAP_VERSION = "$VERSION"
        EOF
        
        # Generate checksum
        cd artifacts
        sha256sum "bootstrap-$ARCH.zip" > "bootstrap-$ARCH.sha256"
        
        echo "=== Artifacts prepared ==="
        ls -la
        cat VERSION.txt
        
    - name: Upload bootstrap artifact
      if: steps.build.outputs.bootstrap_found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: bootstrap-${{ github.event.inputs.architecture }}-${{ env.CUSTOM_PACKAGE_NAME }}
        path: artifacts/
        retention-days: 90
        
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log-${{ github.event.inputs.architecture }}
        path: termux-packages/build.log
        retention-days: 30
        if-no-files-found: ignore
        
    - name: Build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture**: ${{ github.event.inputs.architecture }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package Name**: ${{ env.CUSTOM_PACKAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Bootstrap Found**: ${{ steps.build.outputs.bootstrap_found }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Exit Code**: ${{ steps.build.outputs.build_exit_code }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ steps.build.outputs.bootstrap_found }}" == "true" ]]; then
          echo "### Success!" >> $GITHUB_STEP_SUMMARY
          echo "Download the bootstrap from the Artifacts section below." >> $GITHUB_STEP_SUMMARY
        else
          echo "### Build Issues" >> $GITHUB_STEP_SUMMARY
          echo "The bootstrap file was not generated. Check the build log artifact for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Common issues:" >> $GITHUB_STEP_SUMMARY
          echo "- Package compilation errors" >> $GITHUB_STEP_SUMMARY
          echo "- Missing dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Timeout (build can take 4-8 hours)" >> $GITHUB_STEP_SUMMARY
        fi
