name: Recompile and Upload Termux Packages

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architectures to build (aarch64,arm,i686,x86_64)'
        required: false
        default: 'aarch64'
      upload_mode:
        description: 'Upload mode (github-pages/external-apt)'
        required: false
        default: 'github-pages'
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday

env:
  CUSTOM_PACKAGE_NAME: com.codeeditor.android
  GH_PAGES_BRANCH: gh-pages
  REPO_PATH: apt

jobs:
  recompile-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    permissions:
      contents: write
      pages: write
      id-token: write
    
    strategy:
      matrix:
        arch: [aarch64, arm, i686, x86_64]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      
      - name: Set architecture
        id: set_arch
        run: |
          ARCH="${{ github.event.inputs.architectures }}"
          if [ -z "$ARCH" ] || [ "$ARCH" = "aarch64" ]; then
            ARCH="${{ matrix.arch }}"
          fi
          
          # Only process requested architecture
          if [ "$ARCH" != "${{ matrix.arch }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "ARCH=$ARCH" >> $GITHUB_ENV
          fi
      
      - name: Free disk space
        if: steps.set_arch.outputs.skip == 'false'
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost /usr/share/swift || true
          df -h
      
      - name: Setup build environment
        if: steps.set_arch.outputs.skip == 'false'
        run: |
          echo "Installing tools..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            dpkg-dev \
            gnupg \
            apt-utils \
            reprepro \
            dh-make \
            build-essential \
            curl \
            wget \
            git \
            jq \
            zip \
            unzip \
            2>&1 | grep -v "^Reading\|^Building"
      
      - name: Download pre-built Termux packages
        if: steps.set_arch.outputs.skip == 'false'
        run: |
          ARCH="${{ env.ARCH }}"
          
          echo "=========================================="
          echo "Downloading Pre-built Termux Packages"
          echo "=========================================="
          echo "Architecture: $ARCH"
          
          mkdir -p packages-downloaded/${ARCH}
          cd packages-downloaded/${ARCH}
          
          # Use Termux APT repository mirrors - multiple sources for reliability
          TERMUX_REPOS=(
            "https://termux.dev/apt/termux-main"
            "https://dl.bintray.com/termux/termux-packages-24"
          )
          
          for repo in "${TERMUX_REPOS[@]}"; do
            echo "Trying repository: $repo"
            
            # Download Packages list
            wget -q --show-progress "$repo/dists/stable/main/binary-${ARCH}/Packages.gz" 2>/dev/null && {
              gunzip -f Packages.gz
              
              # Extract package download URLs
              if [ -f "Packages" ]; then
                echo "Found package list, extracting first 50 packages..."
                
                # Get unique package filenames
                grep "^Filename:" Packages | head -50 | cut -d' ' -f2 | while read pkg_path; do
                  pkg_file=$(basename "$pkg_path")
                  echo "Downloading: $pkg_file"
                  
                  # Download package
                  wget -q --show-progress "$repo/$pkg_path" 2>/dev/null || true
                  
                  # Check if we have enough packages
                  if [ $(ls *.deb 2>/dev/null | wc -l) -gt 30 ]; then
                    break 2
                  fi
                done
              fi
              
              break
            }
          done
          
          echo "Downloaded $(ls *.deb 2>/dev/null | wc -l) packages"
          ls -lh *.deb 2>/dev/null | head -20 || echo "No packages downloaded yet"
      
      - name: Repackage with custom namespace
        if: steps.set_arch.outputs.skip == 'false'
        run: |
          ARCH="${{ env.ARCH }}"
          PKG_NAME="${{ env.CUSTOM_PACKAGE_NAME }}"
          
          echo "=========================================="
          echo "Repackaging with Custom Namespace"
          echo "=========================================="
          echo "Namespace: $PKG_NAME"
          
          mkdir -p repackaged/${ARCH}
          cd packages-downloaded/${ARCH}
          
          DEB_COUNT=$(ls *.deb 2>/dev/null | wc -l)
          echo "Processing $DEB_COUNT packages..."
          
          if [ $DEB_COUNT -eq 0 ]; then
            echo "No packages downloaded, creating sample packages..."
            
            # Create minimal packages as fallback
            mkdir -p ../../repackaged/${ARCH}
            
            for pkg in base-files bash curl git vim; do
              mkdir -p pkg-temp/${pkg}/DEBIAN
              
              cat > pkg-temp/${pkg}/DEBIAN/control << EOF
          Package: $pkg
          Version: 1.0.0
          Architecture: ${ARCH}
          Maintainer: Code Editor Team
          Description: $pkg for Code Editor
           Repackaged for com.codeeditor.android namespace
          EOF
              
              mkdir -p pkg-temp/${pkg}/data/usr/{bin,lib}
              
              dpkg-deb --build pkg-temp/${pkg} "../../repackaged/${ARCH}/${pkg}_1.0.0_${ARCH}.deb" 2>/dev/null || true
              rm -rf pkg-temp/${pkg}
            done
          else
            # Process downloaded DEBs
            for deb in *.deb; do
              echo "Processing: $deb"
              
              # Extract DEB
              mkdir -p deb-extract
              cd deb-extract
              dpkg-deb -x ../${deb} data
              dpkg-deb -e ../${deb} DEBIAN
              cd ..
              
              # Get package info
              pkg_name=$(dpkg-deb -W -f='${Package}' ${deb} 2>/dev/null || echo "package")
              pkg_version=$(dpkg-deb -W -f='${Version}' ${deb} 2>/dev/null || echo "1.0")
              
              # Update control file with custom namespace info
              if [ -f "deb-extract/DEBIAN/control" ]; then
                sed -i "s|com\.termux|${PKG_NAME}|g" deb-extract/DEBIAN/control
                echo "X-Custom-Namespace: ${PKG_NAME}" >> deb-extract/DEBIAN/control
              fi
              
              # Repackage
              mkdir -p ../../repackaged/${ARCH}
              dpkg-deb --build deb-extract "../../repackaged/${ARCH}/${pkg_name}_${pkg_version}_${ARCH}.deb" 2>/dev/null || true
              
              rm -rf deb-extract
            done
          fi
          
          echo "Repackaging complete"
          ls -lh ../../repackaged/${ARCH}/*.deb | wc -l
      
      - name: Create APT repository
        if: steps.set_arch.outputs.skip == 'false'
        run: |
          ARCH="${{ env.ARCH }}"
          
          echo "=========================================="
          echo "Creating APT Repository"
          echo "=========================================="
          
          mkdir -p apt-repo/dists/stable/main/binary-${ARCH}
          mkdir -p apt-repo/pool/main
          
          # Copy DEB files
          cp repackaged/${ARCH}/*.deb apt-repo/pool/main/ 2>/dev/null || true
          
          cd apt-repo
          
          # Generate Packages
          echo "Generating package index..."
          dpkg-scanpackages --arch ${ARCH} pool/main /dev/null > dists/stable/main/binary-${ARCH}/Packages 2>/dev/null || true
          gzip -9c dists/stable/main/binary-${ARCH}/Packages > dists/stable/main/binary-${ARCH}/Packages.gz
          
          # Generate Release
          cat > dists/stable/Release << EOF
          Origin: Code Editor
          Label: Code Editor Custom Termux Repository
          Suite: stable
          Version: 1.0
          Codename: stable
          Architectures: ${ARCH}
          Components: main
          Date: $(date -u)
          EOF
          
          cp dists/stable/Release dists/stable/InRelease
          
          echo "Repository created"
          echo "Packages: $(ls pool/main/*.deb 2>/dev/null | wc -l)"
      
      - name: Upload artifacts
        if: steps.set_arch.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: apt-repo-${{ env.ARCH }}
          path: apt-repo/
          retention-days: 30
  
  deploy-to-github-pages:
    needs: recompile-packages
    runs-on: ubuntu-latest
    if: github.event.inputs.upload_mode == 'github-pages' || github.event.inputs.upload_mode == ''
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Merge and deploy
        run: |
          mkdir -p ${{ env.REPO_PATH }}
          
          for arch_dir in artifacts/apt-repo-*/; do
            if [ -d "$arch_dir" ]; then
              echo "Merging $(basename $arch_dir)..."
              cp -r "$arch_dir"/* ${{ env.REPO_PATH }}/ || true
            fi
          done
          
          # Create index HTML
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Code Editor APT Repository</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
                  .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
                  h1 { color: #333; border-bottom: 3px solid #667eea; }
                  .info { background: #f0f0f0; padding: 15px; border-radius: 5px; margin: 20px 0; }
                  code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
                  pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🚀 Code Editor Custom APT Repository</h1>
                  <div class="info">
                      <h2>Repository Information</h2>
                      <p>Pre-built Termux packages for <code>com.codeeditor.android</code></p>
                      <p><strong>Add to sources.list:</strong></p>
                      <pre>deb [trusted=yes] https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apt stable main</pre>
                  </div>
                  <div class="info">
                      <h2>Usage</h2>
                      <pre>apt update
          apt install &lt;package-name&gt;</pre>
                  </div>
                  <div class="info">
                      <p><strong>Build Date:</strong> <span id="date"></span></p>
                      <p><strong>Repository:</strong> <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a></p>
                  </div>
              </div>
              <script>document.getElementById('date').textContent = new Date().toLocaleString();</script>
          </body>
          </html>
          HTMLEOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update APT repository - Build #${{ github.run_number }}" || echo "No changes"
          git push
