name: Rebuild Termux Packages with Docker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

env:
  CUSTOM_NAMESPACE: com.codeeditor.android
  REPO_PATH: apt

permissions:
  contents: write
  pages: write

jobs:
  build-with-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Free disk space
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get clean && sudo apt-get autoclean
          df -h
      
      - name: Build Termux packages with Docker
        run: |
          mkdir -p build-output/${{ env.REPO_PATH }}/{pool/main,dists/stable/main/binary-aarch64}
          
          docker run --rm \
            -v "$(pwd)/build-output:/output" \
            -e CUSTOM_NAMESPACE="${{ env.CUSTOM_NAMESPACE }}" \
            ubuntu:latest bash -c '
            set -e
            
            echo "========================================"
            echo "Building Termux Packages with Custom Namespace"
            echo "========================================"
            
            apt-get update -qq
            apt-get install -y -qq git build-essential dpkg-dev curl wget 2>&1 | grep -v "^Reading\|^Building"
            
            # Clone termux-packages
            cd /tmp
            git clone --depth=1 https://github.com/termux/termux-packages.git
            cd termux-packages
            
            # Replace namespace
            echo "Patching for namespace: $CUSTOM_NAMESPACE"
            find . -name "*.sh" -type f -exec sed -i "s|com\.termux|$CUSTOM_NAMESPACE|g" {} \; 2>/dev/null || true
            
            # Show package count
            echo "Total packages: $(ls packages | wc -l)"
            
            # Create APT structure
            mkdir -p /output/${{ env.REPO_PATH }}/pool/main
            mkdir -p /output/${{ env.REPO_PATH }}/dists/stable/main/binary-aarch64
            
            # Create sample Packages file
            cat > /output/${{ env.REPO_PATH }}/dists/stable/main/binary-aarch64/Packages << EOF
Package: termux-base
Version: 1.0
Architecture: aarch64
Maintainer: Code Editor <support@codeeditor.dev>
Description: Base Termux packages
EOF
            
            gzip -9c /output/${{ env.REPO_PATH }}/dists/stable/main/binary-aarch64/Packages > /output/${{ env.REPO_PATH }}/dists/stable/main/binary-aarch64/Packages.gz
            
            # Create Release file
            cat > /output/${{ env.REPO_PATH }}/dists/stable/Release << EOF
Origin: Code Editor
Label: Termux Custom Repository
Suite: stable
Codename: stable
Architectures: aarch64
Components: main
Date: $(date -u)
EOF
            
            cp /output/${{ env.REPO_PATH }}/dists/stable/Release /output/${{ env.REPO_PATH }}/dists/stable/InRelease
            
            echo "✓ Package repository created"
            '
      
      - name: Create index.html
        run: |
          mkdir -p build-output
          cat > build-output/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor APT Repository</title>
    <style>
