name: Rebuild Termux Packages with Custom Namespace

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architectures to rebuild (all/aarch64/arm/i686/x86_64)'
        required: false
        default: 'all'
      build_mode:
        description: 'Build mode (full/priority)'
        required: false
        default: 'priority'
  schedule:
    - cron: '0 0 1 * *'  # Monthly rebuild

env:
  CUSTOM_PACKAGE_NAME: com.codeeditor.android
  CUSTOM_DATA_PATH: /data/data/com.codeeditor.android/files
  REPO_PATH: apt

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  rebuild-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    strategy:
      matrix:
        arch: [aarch64, arm, i686, x86_64]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Free disk space
        run: |
          echo "=========================================="
          echo "Freeing disk space"
          echo "=========================================="
          df -h
          
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean && sudo apt-get autoclean && sudo apt-get autoremove -y
          
          echo "After cleanup:"
          df -h
      
      - name: Install build dependencies
        run: |
          echo "=========================================="
          echo "Installing build dependencies"
          echo "=========================================="
          
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            gcc \
            g++ \
            make \
            autoconf \
            automake \
            libtool \
            pkg-config \
            curl \
            wget \
            git \
            dpkg-dev \
            apt-utils \
            reprepro \
            devscripts \
            dh-make \
            jq \
            zip \
            unzip \
            tar \
            gzip \
            bzip2 \
            xz-utils \
            patch \
            patchelf \
            2>&1 | grep -v "^Reading\|^Building\|^Selecting"
          
          echo "✓ Build dependencies installed"
      
      - name: Clone termux-packages repository
        run: |
          echo "=========================================="
          echo "Cloning termux-packages repository"
          echo "=========================================="
          
          ARCH="${{ matrix.arch }}"
          
          # Clone dengan retry
          for i in {1..3}; do
            if git clone --depth=1 --quiet https://github.com/termux/termux-packages.git termux-packages-repo; then
              echo "✓ Repository cloned successfully"
              break
            fi
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          cd termux-packages-repo
          
          # Show package count
          TOTAL_PACKAGES=$(ls packages/ 2>/dev/null | wc -l)
          echo "Total packages available: $TOTAL_PACKAGES"
          echo ""
          echo "Sample packages:"
          ls packages/ | head -20
      
      - name: Setup build environment with custom namespace
        run: |
          echo "=========================================="
          echo "Setting up build environment"
          echo "=========================================="
          
          ARCH="${{ matrix.arch }}"
          CUSTOM_PKG="${{ env.CUSTOM_PACKAGE_NAME }}"
          CUSTOM_PATH="${{ env.CUSTOM_DATA_PATH }}"
          
          cd termux-packages-repo
          
          # Create build output directory
          mkdir -p "$GITHUB_WORKSPACE/built-packages/${ARCH}"
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          
          # Export build variables
          export TERMUX_ARCH=$ARCH
          export PREFIX="/data/data/${CUSTOM_PKG}/files/usr"
          export TERMUX_PKG_TMPDIR="/tmp/termux-pkg"
          
          # Patch main build scripts
          if [ -f "scripts/properties.sh" ]; then
            echo "Patching scripts/properties.sh..."
            sed -i "s|com\.termux|${CUSTOM_PKG}|g" scripts/properties.sh
            sed -i "s|/data/data/com\.termux|${CUSTOM_PATH}|g" scripts/properties.sh
          fi
          
          if [ -f "scripts/build/setup/termux-setup-build.sh" ]; then
            echo "Patching termux-setup-build.sh..."
            sed -i "s|com\.termux|${CUSTOM_PKG}|g" scripts/build/setup/termux-setup-build.sh
            sed -i "s|/data/data/com\.termux|${CUSTOM_PATH}|g" scripts/build/setup/termux-setup-build.sh
          fi
          
          echo "Architecture: $ARCH"
          echo "Custom package: $CUSTOM_PKG"
          echo "Custom path: $CUSTOM_PATH"
          echo "✓ Build environment configured"
      
      - name: Build priority packages
        run: |
          echo "=========================================="
          echo "Building priority packages for ${{ matrix.arch }}"
          echo "=========================================="
          
          ARCH="${{ matrix.arch }}"
          CUSTOM_PKG="${{ env.CUSTOM_PACKAGE_NAME }}"
          CUSTOM_PATH="${{ env.CUSTOM_DATA_PATH }}"
          
          cd termux-packages-repo
          
          # Priority packages list
          PRIORITY_PACKAGES=(
            "base-files" "bash" "dash" "coreutils"
            "sed" "grep" "gawk" "less" "tar"
            "curl" "wget" "git" "openssh"
            "python" "nodejs" "php" "ruby"
            "vim" "nano" "nano-language-files"
            "gcc" "clang" "make" "cmake" "autoconf" "automake"
            "openssl" "libc++" "zlib"
            "sqlite" "jq" "zip" "unzip"
          )
          
          BUILT=0
          FAILED=0
          
          for pkg_name in "${PRIORITY_PACKAGES[@]}"; do
            if [ -d "packages/${pkg_name}" ]; then
              echo ""
              echo "▶ Building: $pkg_name"
              
              cd "packages/${pkg_name}"
              
              # Patch individual package build.sh
              if [ -f "build.sh" ]; then
                sed -i "s|com\.termux|${CUSTOM_PKG}|g" build.sh
                sed -i "s|/data/data/com\.termux|${CUSTOM_PATH}|g" build.sh
              fi
              
              # Source and run build script with error handling
              if bash build.sh > "$GITHUB_WORKSPACE/build-logs/${pkg_name}-${ARCH}.log" 2>&1; then
                echo "✓ Built: $pkg_name"
                ((BUILT++))
              else
                echo "✗ Failed: $pkg_name (check logs)"
                ((FAILED++))
              fi
              
              cd ../..
            else
              echo "⊘ Not found: $pkg_name"
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "Priority build summary:"
          echo "Successfully built: $BUILT packages"
          echo "Failed: $FAILED packages"
          echo "=========================================="
      
      - name: Build remaining packages
        if: ${{ github.event.inputs.build_mode == 'full' }}
        run: |
          echo "=========================================="
          echo "Building remaining packages for ${{ matrix.arch }}"
          echo "=========================================="
          
          ARCH="${{ matrix.arch }}"
          CUSTOM_PKG="${{ env.CUSTOM_PACKAGE_NAME }}"
          CUSTOM_PATH="${{ env.CUSTOM_DATA_PATH }}"
          
          cd termux-packages-repo
          
          # Packages already built
          PRIORITY_PACKAGES=(
            "base-files" "bash" "dash" "coreutils"
            "sed" "grep" "gawk" "less" "tar"
            "curl" "wget" "git" "openssh"
            "python" "nodejs" "php" "ruby"
            "vim" "nano" "nano-language-files"
            "gcc" "clang" "make" "cmake" "autoconf" "automake"
            "openssl" "libc++" "zlib"
            "sqlite" "jq" "zip" "unzip"
          )
          
          BUILT=0
          FAILED=0
          SKIPPED=0
          
          for pkg_dir in packages/*/; do
            pkg_name=$(basename "$pkg_dir")
            
            # Check if already built
            skip=false
            for skip_pkg in "${PRIORITY_PACKAGES[@]}"; do
              if [ "$pkg_name" = "$skip_pkg" ]; then
                skip=true
                break
              fi
            done
            
            if [ "$skip" = true ]; then
              ((SKIPPED++))
              continue
            fi
            
            if [ -f "${pkg_dir}build.sh" ]; then
              echo "▶ Building: $pkg_name..."
              
              cd "$pkg_dir"
              
              # Patch build.sh
              sed -i "s|com\.termux|${CUSTOM_PKG}|g" build.sh
              sed -i "s|/data/data/com\.termux|${CUSTOM_PATH}|g" build.sh
              
              # Build with timeout (15 min per package)
              if timeout 900 bash build.sh > "$GITHUB_WORKSPACE/build-logs/${pkg_name}-${ARCH}.log" 2>&1; then
                echo "✓ Built: $pkg_name"
                ((BUILT++))
              else
                echo "✗ Failed: $pkg_name"
                ((FAILED++))
              fi
              
              cd ../..
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "Full build summary:"
          echo "Successfully built: $BUILT packages"
          echo "Failed: $FAILED packages"
          echo "Skipped (priority done): $SKIPPED packages"
          echo "=========================================="
      
      - name: Collect built packages
        run: |
          echo "=========================================="
          echo "Collecting built .deb packages"
          echo "=========================================="
          
          ARCH="${{ matrix.arch }}"
          OUTPUT_DIR="$GITHUB_WORKSPACE/built-packages/${ARCH}"
          
          mkdir -p "$OUTPUT_DIR"
          
          # Find .deb files in debs directory (standard location)
          if [ -d "termux-packages-repo/debs" ]; then
            find termux-packages-repo/debs -name "*.deb" -type f | while read deb; do
              echo "Found: $(basename $deb)"
              cp "$deb" "$OUTPUT_DIR/" || true
            done
          fi
          
          # Also check in output directory
          if [ -d "termux-packages-repo/output" ]; then
            find termux-packages-repo/output -name "*.deb" -type f | while read deb; do
              echo "Found: $(basename $deb)"
              cp "$deb" "$OUTPUT_DIR/" || true
            done
          fi
          
          # Count collected packages
          DEB_COUNT=$(ls "$OUTPUT_DIR"/*.deb 2>/dev/null | wc -l)
          echo ""
          echo "Total .deb files collected: $DEB_COUNT"
          
          if [ $DEB_COUNT -gt 0 ]; then
            echo ""
            echo "Packages list:"
            ls -lh "$OUTPUT_DIR"/*.deb | awk '{print $9, "(" $5 ")"}'
          fi
      
      - name: Create APT repository structure
        run: |
          echo "=========================================="
          echo "Creating APT repository structure"
          echo "=========================================="
          
          ARCH="${{ matrix.arch }}"
          REPO_DIR="$GITHUB_WORKSPACE/apt-repo"
          
          mkdir -p "${REPO_DIR}/dists/stable/main/binary-${ARCH}"
          mkdir -p "${REPO_DIR}/dists/stable/main/source"
          mkdir -p "${REPO_DIR}/pool/main"
          mkdir -p "${REPO_DIR}/metadata"
          
          # Copy built packages to pool
          if [ -d "$GITHUB_WORKSPACE/built-packages/${ARCH}" ]; then
            cp "$GITHUB_WORKSPACE/built-packages/${ARCH}"/*.deb "${REPO_DIR}/pool/main/" 2>/dev/null || true
          fi
          
          # Fix filenames (remove colons and problematic chars)
          cd "${REPO_DIR}/pool/main"
          for deb in *.deb; do
            if [ -f "$deb" ]; then
              new_name=$(echo "$deb" | sed 's/:/_/g' | sed 's/+/_/g')
              if [ "$deb" != "$new_name" ]; then
                mv "$deb" "$new_name"
              fi
            fi
          done
          cd - > /dev/null
          
          # Generate Packages file
          echo "Generating Packages file..."
          dpkg-scanpackages --arch ${ARCH} "${REPO_DIR}/pool/main" /dev/null \
            > "${REPO_DIR}/dists/stable/main/binary-${ARCH}/Packages" 2>/dev/null || true
          
          # Create gzipped version
          gzip -9c "${REPO_DIR}/dists/stable/main/binary-${ARCH}/Packages" \
            > "${REPO_DIR}/dists/stable/main/binary-${ARCH}/Packages.gz"
          
          # Create Release file
          cat > "${REPO_DIR}/dists/stable/Release" << EOF
Origin: Code Editor
Label: Code Editor Custom Termux Repository (${{ matrix.arch }})
Suite: stable
Version: 1.0
Codename: stable
Architectures: ${ARCH}
Components: main
Date: $(date -u)
Acquire-By-Hash: yes
EOF
          
          cp "${REPO_DIR}/dists/stable/Release" "${REPO_DIR}/dists/stable/InRelease"
          
          echo "✓ Repository structure created"
          echo "Packages: $(ls ${REPO_DIR}/pool/main/*.deb 2>/dev/null | wc -l)"
      
      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apt-repo-${{ matrix.arch }}
          path: apt-repo/
          retention-days: 30

  deploy-to-github-pages:
    needs: rebuild-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-download
      
      - name: Prepare APT repository for all architectures
        run: |
          echo "=========================================="
          echo "Preparing APT repository for GitHub Pages"
          echo "=========================================="
          
          REPO_PATH="apt"
          
          # Create directory structure for all architectures
          mkdir -p "${REPO_PATH}/dists/stable/main/binary-aarch64"
          mkdir -p "${REPO_PATH}/dists/stable/main/binary-arm"
          mkdir -p "${REPO_PATH}/dists/stable/main/binary-i686"
          mkdir -p "${REPO_PATH}/dists/stable/main/binary-x86_64"
          mkdir -p "${REPO_PATH}/dists/stable/main/source"
          mkdir -p "${REPO_PATH}/pool/main"
          mkdir -p "${REPO_PATH}/metadata"
          
          # Copy packages from all architectures
          echo "Copying packages from all architectures..."
          
          for arch_dir in artifacts-download/apt-repo-*/; do
            if [ -d "$arch_dir" ]; then
              arch_name=$(basename "$arch_dir" | sed 's/apt-repo-//')
              echo "Processing: $arch_name"
              
              # Copy packages
              if [ -d "$arch_dir/pool/main" ]; then
                cp "$arch_dir/pool/main"/*.deb "${REPO_PATH}/pool/main/" 2>/dev/null || true
              fi
              
              # Copy Packages files
              if [ -d "$arch_dir/dists/stable/main/binary-${arch_name}" ]; then
                cp "$arch_dir/dists/stable/main/binary-${arch_name}/Packages"* \
                   "${REPO_PATH}/dists/stable/main/binary-${arch_name}/" 2>/dev/null || true
              fi
            fi
          done
          
          # Generate unified Packages files for each architecture
          echo "Generating unified Packages files..."
          
          for ARCH in aarch64 arm i686 x86_64; do
            echo "Processing architecture: $ARCH"
            
            dpkg-scanpackages --arch ${ARCH} "${REPO_PATH}/pool/main" /dev/null \
              > "${REPO_PATH}/dists/stable/main/binary-${ARCH}/Packages" 2>/dev/null || true
            
            gzip -9c "${REPO_PATH}/dists/stable/main/binary-${ARCH}/Packages" \
              > "${REPO_PATH}/dists/stable/main/binary-${ARCH}/Packages.gz"
          done
          
          # Create unified Release file
          cat > "${REPO_PATH}/dists/stable/Release" << EOF
Origin: Code Editor
Label: Code Editor Custom Termux Repository (com.codeeditor.android)
Suite: stable
Version: 1.0
Codename: stable
Architectures: aarch64 arm i686 x86_64
Components: main
Date: $(date -u)
Acquire-By-Hash: yes
Description: Custom Termux packages rebuilt for com.codeeditor.android namespace
EOF
          
          cp "${REPO_PATH}/dists/stable/Release" "${REPO_PATH}/dists/stable/InRelease"
          
          # Create metadata file
          cat > "${REPO_PATH}/metadata/build-info.json" << EOF
{
  "repository": "Code Editor Custom APT Repository",
  "namespace": "com.codeeditor.android",
  "build_date": "$(date -u -Iseconds)",
  "build_number": "${{ github.run_number }}",
  "repository_url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apt",
  "architectures": ["aarch64", "arm", "i686", "x86_64"],
  "components": ["main"],
  "suite": "stable",
  "build_method": "termux-packages (recompiled)"
}
EOF
          
          echo "✓ Repository prepared"
          echo ""
          echo "Repository structure:"
          find "${REPO_PATH}" -type f | sort | head -30
      
      - name: Generate index.html
        run: |
          cat > index.html << 'HTMLEOF'
