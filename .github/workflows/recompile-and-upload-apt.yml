      - name: Generate directory index
        run: |
          python3 << 'PYSCRIPT'
import os
import json

def gen_index(path):
    items = []
    for f in sorted(os.listdir(path)):
        if f == 'index.html':
            continue
        fp = os.path.join(path, f)
        is_dir = os.path.isdir(fp)
        size = 0 if is_dir else os.path.getsize(fp)
        items.append({'name': f, 'type': 'dir' if is_dir else 'file', 'size': size})
    
    html = '''<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Directory</title>
    <style>
        body { font-family: monospace; background: #f5f5f5; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 5px; }
        a { color: #667eea; text-decoration: none; }
        a:hover { text-decoration: underline; }
        tr { border-bottom: 1px solid #ddd; }
        td { padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📁 Directory Index</h2>
        <table>'''
    
    for item in items:
        icon = '📁' if item['type'] == 'dir' else '📄'
        href = item['name'] + ('/' if item['type'] == 'dir' else '')
        size_str = '' if item['type'] == 'dir' else f"{item['size'] / 1024 / 1024:.1f}M"
        html += f'''
            <tr>
                <td>{icon}</td>
                <td><a href="{href}">{item['name']}</a></td>
                <td>{size_str}</td>
            </tr>'''
    
    html += '''
        </table>
    </div>
</body>
</html>'''
    
    with open(os.path.join(path, 'index.html'), 'w') as f:
        f.write(html)
    
    for f in os.listdir(path):
        fp = os.path.join(path, f)
        if os.path.isdir(fp) and f not in ['.git', '__pycache__']:
            gen_index(fp)

if os.path.exists('build-output'):
    gen_index('build-output')
    print("✓ Indexes generated")
PYSCRIPT
      
      - name: Prepare for gh-pages
        run: |
          mkdir -p gh-pages
          cp -r build-output/* gh-pages/
          ls -la gh-pages/
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          force_orphan: true
