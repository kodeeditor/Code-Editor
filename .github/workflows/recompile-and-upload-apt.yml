def process_directories(root_dir):
    """Recursively process all directories"""
    print("=" * 50)
    print("Generating Directory Indexes")
    print("=" * 50)
    
    for dirpath, dirnames, filenames in os.walk(root_dir):
        # Skip hidden directories
        dirnames[:] = [d for d in dirnames if not d.startswith('.')]
        
        # Generate index for current directory
        try:
            html_content = generate_index_html(dirpath)
            index_path = os.path.join(dirpath, 'index.html')
            
            with open(index_path, 'w', encoding='utf-8') as f:
                f.write(html_content)
            
            rel_path = os.path.relpath(dirpath, root_dir)
            print(f"✓ {rel_path}/index.html")
        except Exception as e:
            print(f"✗ Error in {dirpath}: {e}")

