      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "=========================================="
          echo "Committing changes to gh-pages"
          echo "=========================================="
          
          git add -A
          
          CHANGES=$(git status --short | wc -l)
          if [ $CHANGES -gt 0 ]; then
            git commit -m "Rebuild Termux packages - Build #${{ github.run_number }}" \
              -m "Recompiled all packages with com.codeeditor.android namespace" \
              -m "Architectures: aarch64, arm, i686, x86_64" \
              -m "Date: $(date -u)" \
              -m "Repository: https://github.com/${{ github.repository }}"
            
            git push origin gh-pages
            
            echo ""
            echo "✓ Changes committed and pushed"
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✓ Build and Deployment Complete!"
          echo "=========================================="
          echo "Repository: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apt"
